openapi: 3.1.0
info:
  title: LLM Gateway
  version: "1.0"
  description: |
    OpenAI- and Anthropic-compatible gateway in front of the Vilao and CKey marketplaces.
    The `model` field is a pool name (preferred) or a raw seller listing id (passthrough).
    Every `usage` object gains `cost`, `cost_currency` and `cost_source`.
    Full prose reference with real examples: /docs
servers:
  - url: http://localhost:3000/v1
    description: OpenAI-family endpoints
  - url: http://localhost:3000
    description: Root — for Anthropic SDKs (they append /v1) and for the /api management endpoints
tags:
  - { name: inference, description: OpenAI/Anthropic-compatible model calls under /v1 }
  - { name: management, description: "Pools, catalog, keys, usage under /api. Admin key required (403 otherwise)." }
security:
  - bearer: []
  - apiKey: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "Authorization: Bearer gw-..." }
    apiKey: { type: apiKey, in: header, name: x-api-key, description: "x-api-key: gw-..." }
  headers:
    X-Gateway-Pool:     { schema: { type: string }, description: Pool that routed the request; absent on passthrough }
    X-Gateway-Listing:  { schema: { type: string }, description: "Listing that actually served, e.g. vilao:<provider>:<model> or ckey:<seller>/<model>" }
    X-Gateway-Attempts: { schema: { type: integer, minimum: 1 }, description: Members tried; >1 means a fallback happened }
  schemas:
    CostFields:
      type: object
      description: Added by the gateway to every `usage` object, including the usage frame of a stream.
      properties:
        cost: { type: number, description: VND for this call }
        cost_currency: { type: string, enum: [VND] }
        cost_source:
          type: string
          enum: [upstream, estimated, floor]
          description: |
            upstream — seller reported it (authoritative).
            estimated — computed from listing prices as max(min_charge, per_request + tokens/1e6 × price).
            floor — no token counts available; only the minimum charge is known (lower bound).
    ManagementError:
      type: object
      properties:
        error:
          type: object
          properties: { code: { type: string }, message: { type: string } }
    Listing:
      type: object
      description: One seller's offer of one model. Use `id` as listing_id in member operations.
      properties:
        id: { type: string, example: "ckey:dungcsnd113/claude-opus-5" }
        platform: { type: string, enum: [ckey, vilao] }
        seller: { type: [string, "null"] }
        display_name: { type: string }
        base_model: { type: string }
        price_in: { type: [number, "null"], description: VND per 1M input tokens }
        price_out: { type: [number, "null"] }
        price_request: { type: [number, "null"], description: flat VND per call }
        price_floor: { type: [number, "null"], description: minimum charge per call }
        context_len: { type: [integer, "null"] }
        success_rate: { type: [number, "null"], description: published by Vilao; always null on CKey }
        total_requests: { type: [integer, "null"] }
        stale: { type: integer, description: 1 if it vanished from the last sync }
    PoolMember:
      type: object
      properties:
        listing_id: { type: string }
        position: { type: [integer, "null"], description: 1-based; null for candidates }
        state: { type: string, enum: [active, blocked, candidate] }
        weight: { type: number }
        platform: { type: string }
        display_name: { type: string }
        price_in: { type: [number, "null"] }
        published_success_rate: { type: [number, "null"] }
        measured: { type: [object, "null"], properties: { calls: { type: integer }, failures: { type: integer } } }
        reliability: { type: number, description: 0–1, blends published and measured }
        estimated_cost_vnd: { type: number }
        score: { type: number, description: estimated cost ÷ reliability; lower is better }
        last_probe: { type: [object, "null"] }
    PoolDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        strategy: { type: string, enum: [failover, cheapest, round-robin, weighted, pinned] }
        max_attempts: { type: integer }
        daily_budget: { type: [number, "null"] }
        monthly_budget: { type: [number, "null"] }
        max_price_per_request: { type: [number, "null"] }
        rule: { type: [object, "null"], properties: { filter: { type: object }, autoAdmit: { type: boolean } } }
        spend: { type: object, properties: { today: { type: number }, month: { type: number }, wastedToday: { type: number }, unpricedToday: { type: integer } } }
        verify_estimate: { type: object, properties: { members: { type: integer }, cost: { type: number, description: upper bound in VND } } }
        members: { type: array, items: { $ref: "#/components/schemas/PoolMember" } }
        candidates: { type: array, items: { $ref: "#/components/schemas/PoolMember" } }
    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string }
    AnthropicError:
      type: object
      properties:
        type: { type: string, enum: [error] }
        error:
          type: object
          properties: { type: { type: string }, message: { type: string } }
    Model:
      type: object
      properties:
        id: { type: string, description: Pool name or listing id — use as `model` }
        object: { type: string, enum: [model] }
        created: { type: integer }
        owned_by: { type: string, description: '"gateway" for pools; "ckey" or "vilao" for raw listings' }
        gateway:
          type: object
          description: Gateway extension.
          properties:
            kind: { type: string, enum: [pool, listing] }
            members: { type: integer }
            strategy: { type: string, enum: [failover, cheapest, round-robin, weighted, pinned] }
            seller: { type: [string, "null"] }
            price_in: { type: [number, "null"], description: VND per 1M input tokens }
  responses:
    AdminRequired:
      description: Key is valid but not role=admin
      content: { application/json: { schema: { $ref: "#/components/schemas/ManagementError" },
                 example: { error: { code: admin_required, message: This endpoint needs a key with role=admin. } } } }
    NotFound:
      description: Pool, listing or key not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ManagementError" } } }
    Unauthorized:
      description: Missing or unknown gateway key
      content: { application/json: { schema: { $ref: "#/components/schemas/OpenAIError" },
                 example: { error: { message: Invalid API key., type: authentication_error, code: invalid_api_key } } } }
    BudgetExhausted:
      description: Pool daily/monthly cap reached — back off, alert operator
      content: { application/json: { schema: { $ref: "#/components/schemas/OpenAIError" },
                 example: { error: { message: "Trần ngày 3₫ đã dùng hết (4₫).", type: insufficient_quota, code: budget_exhausted } } } }
    EmptyPool:
      description: Pool has no active members, or no member is under the per-request price cap
      content: { application/json: { schema: { $ref: "#/components/schemas/OpenAIError" },
                 example: { error: { message: 'Pool "empty-pool" has no active members.', type: invalid_request_error, code: empty_pool } } } }
    AllFailed:
      description: Every pool member failed; message lists each failure
      content: { application/json: { schema: { $ref: "#/components/schemas/OpenAIError" } } }
paths:
  /models:
    get:
      summary: List pools and raw listings
      description: Pools first (owned_by "gateway"), then raw listings. Prefer gateway.kind == "pool".
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [list] }
                  data: { type: array, items: { $ref: "#/components/schemas/Model" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chat/completions:
    post:
      summary: OpenAI Chat Completions
      description: "Standard OpenAI payload. Tool calling and image_url verified. Set stream: true for SSE."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model: { type: string, description: Pool name or listing id. Defaults to the operator's configured listing. }
                messages: { type: array, items: { type: object } }
                stream: { type: boolean }
                max_tokens: { type: integer }
                tools: { type: array, items: { type: object } }
              additionalProperties: true
            example: { model: cheap, messages: [ { role: user, content: Say hello in one word. } ], max_tokens: 8 }
      responses:
        "200":
          description: Chat completion (JSON) or text/event-stream when `stream` is true. `usage` includes CostFields. `model` is the upstream's bare name, not the pool.
          headers:
            X-Gateway-Pool: { $ref: "#/components/headers/X-Gateway-Pool" }
            X-Gateway-Listing: { $ref: "#/components/headers/X-Gateway-Listing" }
            X-Gateway-Attempts: { $ref: "#/components/headers/X-Gateway-Attempts" }
          content:
            application/json:
              example:
                id: chatcmpl-a11e0d42e8ad423ca4a873732a18e857
                object: chat.completion
                created: 1788454181
                model: deepseek-v4-flash
                choices: [ { index: 0, finish_reason: stop, message: { role: assistant, content: Hello! } } ]
                usage: { prompt_tokens: 873, completion_tokens: 3, total_tokens: 876, cost: 5, cost_currency: VND, cost_source: estimated }
            text/event-stream:
              description: 'data: {json} frames; usage arrives in a frame with "choices": []; ends with data: [DONE]'
        "400": { description: "Malformed request (not retried across sellers)", content: { application/json: { schema: { $ref: "#/components/schemas/OpenAIError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/BudgetExhausted" }
        "404": { description: "Passthrough listing not found upstream, or unknown endpoint" }
        "409": { $ref: "#/components/responses/EmptyPool" }
        "502": { $ref: "#/components/responses/AllFailed" }
  /messages:
    post:
      summary: Anthropic Messages
      description: |
        Standard Anthropic payload; send x-api-key and anthropic-version. Both platforms serve this natively.
        Errors use the Anthropic envelope. Anthropic SDKs should use the ROOT base URL (no /v1).
      parameters:
        - { in: header, name: anthropic-version, schema: { type: string }, example: "2023-06-01" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [messages, max_tokens], additionalProperties: true,
                      properties: { model: { type: string }, max_tokens: { type: integer }, messages: { type: array }, stream: { type: boolean } } }
      responses:
        "200":
          description: Anthropic message, `usage` includes CostFields. Streams emit the standard event sequence.
          content:
            application/json:
              example:
                id: chatcmpl-RQOh0QSXygKylj4om2WLjW7A
                type: message
                role: assistant
                model: deepseek-v4-flash
                content: [ { type: text, text: Hi! How can I help you today } ]
                stop_reason: max_tokens
                usage: { input_tokens: 869, output_tokens: 8, cost: 5, cost_currency: VND, cost_source: estimated }
        "401": { description: Bad key, content: { application/json: { schema: { $ref: "#/components/schemas/AnthropicError" } } } }
        "402": { $ref: "#/components/responses/BudgetExhausted" }
        "409": { $ref: "#/components/responses/EmptyPool" }
  /embeddings:
    post:
      summary: OpenAI Embeddings
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [input], additionalProperties: true,
                   properties: { model: { type: string }, input: { oneOf: [ { type: string }, { type: array } ] } } },
                   example: { model: embed, input: hello } } }
      responses:
        "200":
          content:
            application/json:
              example:
                object: list
                model: text-embedding-3-small
                data: [ { object: embedding, index: 0, embedding: [0.0167, -0.0557, 0.0056] } ]
                usage: { prompt_tokens: 1, total_tokens: 1, cost: 3, cost_currency: VND, cost_source: estimated }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /completions:
    post: { summary: OpenAI legacy Completions (passthrough), requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "200": { description: Passthrough; usage gains CostFields } } }
  /responses:
    post: { summary: OpenAI Responses API (passthrough), requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "200": { description: Passthrough; usage gains CostFields } } }
  /moderations:
    post: { summary: OpenAI Moderations (CKey listings only), requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "200": { description: Passthrough } } }
  /rerank:
    post: { summary: Rerank (CKey listings only), requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }, responses: { "200": { description: Passthrough } } }

  /api/catalog:
    servers: [ { url: http://localhost:3000 } ]
    get:
      tags: [management]
      summary: Search listings (same filters as the UI)
      description: "Always compare `matching` to `total`: include_unmeasured=0 removes every CKey listing; verified_only=1 leaves ~16."
      parameters:
        - { in: query, name: platform, schema: { type: string, enum: [ckey, vilao] } }
        - { in: query, name: search, schema: { type: string }, description: substring on display_name / base_model }
        - { in: query, name: seller, schema: { type: string } }
        - { in: query, name: kind, schema: { type: string } }
        - { in: query, name: max_price_in, schema: { type: number }, description: VND per 1M input tokens }
        - { in: query, name: max_price_request, schema: { type: number } }
        - { in: query, name: min_context, schema: { type: integer } }
        - { in: query, name: min_success_rate, schema: { type: number }, description: percent }
        - { in: query, name: min_total_requests, schema: { type: integer } }
        - { in: query, name: max_latency_ms, schema: { type: number } }
        - { in: query, name: supports_tools, schema: { type: string, enum: ["1"] } }
        - { in: query, name: verified_only, schema: { type: string, enum: ["1"] } }
        - { in: query, name: include_unmeasured, schema: { type: string, enum: ["0", "1"], default: "1" } }
        - { in: query, name: include_stale, schema: { type: string, enum: ["1"] } }
        - { in: query, name: limit, schema: { type: integer, maximum: 1000, default: 200 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  matching: { type: integer }
                  filter: { type: object }
                  data: { type: array, items: { $ref: "#/components/schemas/Listing" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AdminRequired" }
  /api/catalog/sync:
    servers: [ { url: http://localhost:3000 } ]
    post:
      tags: [management]
      summary: Refresh both marketplaces and re-apply pool rules
      responses:
        "200":
          content:
            application/json:
              example: { platforms: [ { platform: ckey, seen: 497, markedStale: 21 }, { platform: vilao, seen: 612, markedStale: 21 } ], rules: [ { pool: cheap, admitted: 0, queued: 1 } ] }
        "403": { $ref: "#/components/responses/AdminRequired" }
  /api/pools:
    servers: [ { url: http://localhost:3000 } ]
    get:
      tags: [management]
      summary: Pool summaries
      responses:
        "200":
          content:
            application/json:
              example: { data: [ { id: "…", name: cheap, strategy: cheapest, members_active: 4, members_total: 5, candidates: 13, spend_today_vnd: 266.7 } ] }
        "403": { $ref: "#/components/responses/AdminRequired" }
    post:
      tags: [management]
      summary: Create a pool — its name becomes a model name on /v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "No '/' or whitespace; collides with model names otherwise" }
                strategy: { type: string, enum: [failover, cheapest, round-robin, weighted, pinned], default: failover }
            example: { name: fast, strategy: cheapest }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/PoolDetail" } } } }
        "400": { description: bad_name or bad_strategy }
        "409": { description: exists }
        "403": { $ref: "#/components/responses/AdminRequired" }
  /api/pools/{name}:
    servers: [ { url: http://localhost:3000 } ]
    parameters: [ { in: path, name: name, required: true, schema: { type: string } } ]
    get:
      tags: [management]
      summary: Pool detail with members, candidates, spend and verify estimate
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PoolDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/AdminRequired" }
    patch:
      tags: [management]
      summary: Update settings and/or rule (any subset; omitted fields unchanged)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                strategy: { type: string, enum: [failover, cheapest, round-robin, weighted, pinned] }
                max_attempts: { type: integer }
                daily_budget: { type: [number, "null"], description: VND; null clears }
                monthly_budget: { type: [number, "null"] }
                max_price_per_request: { type: [number, "null"] }
                rule: { type: [object, "null"], description: "Catalog filter in camelCase (platform, search, maxPriceIn, minSuccessRate, minTotalRequests, includeUnmeasured…); null removes" }
                auto_admit: { type: boolean, description: admit rule matches straight into rotation instead of the review queue }
            example: { daily_budget: 20000, rule: { search: deepseek-v4-flash, minSuccessRate: 98 }, auto_admit: false }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PoolDetail" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [management]
      summary: Delete the pool and its memberships
      responses:
        "200": { content: { application/json: { example: { deleted: fast } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/pools/{name}/members:
    servers: [ { url: http://localhost:3000 } ]
    parameters: [ { in: path, name: name, required: true, schema: { type: string } } ]
    post:
      tags: [management]
      summary: Add a listing as an active member (appended last)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [listing_id], properties: { listing_id: { type: string } } },
                     example: { listing_id: "vilao:c06bc6a1-d4ae-4971-bb3b-94b0f7a61471:deepseek-v4-flash" } } } }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/PoolDetail" } } } }
        "404": { description: not_found (pool) or listing_not_found (sync the catalog first) }
    patch:
      tags: [management]
      summary: Change a member's state, position or weight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listing_id]
              properties:
                listing_id: { type: string }
                state: { type: string, enum: [active, blocked, candidate], description: "active=on, blocked=off (keeps its place), candidate=back to review queue" }
                position: { type: integer, minimum: 1, description: 1-based slot in the chain }
                weight: { type: number, description: for the weighted strategy }
            example: { listing_id: "ckey:phatchau036/gpt-5.6-luna", state: blocked }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PoolDetail" } } } }
    delete:
      tags: [management]
      summary: Remove a member entirely
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [listing_id], properties: { listing_id: { type: string } } } } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/PoolDetail" } } } }
  /api/pools/{name}/verify:
    servers: [ { url: http://localhost:3000 } ]
    parameters:
      - { in: path, name: name, required: true, schema: { type: string } }
      - { in: query, name: include_candidates, schema: { type: string, enum: ["0", "1"], default: "1" } }
    post:
      tags: [management]
      summary: "Probe every member once. SPENDS REAL MONEY — read verify_estimate.cost first."
      description: Each probe is billed at the seller's minimum charge regardless of tokens. Failed probes are not billed, so spent_vnd ≤ quoted_max_vnd.
      responses:
        "200":
          content:
            application/json:
              example:
                pool: fast
                quoted_max_vnd: 5
                spent_vnd: 0
                alive: 1
                total: 1
                results: [ { listingId: "vilao:c06bc6a1-…:deepseek-v4-flash", displayName: deepseek-v4-flash, platform: vilao, ok: true, latencyMs: 4522, costVnd: null, errorCode: null } ]
  /api/usage:
    servers: [ { url: http://localhost:3000 } ]
    get:
      tags: [management]
      summary: Spend today, by day, by listing
      parameters:
        - { in: query, name: days, schema: { type: integer, default: 14 } }
        - { in: query, name: limit, schema: { type: integer, default: 30 }, description: listings }
        - { in: query, name: recent, schema: { type: string, enum: ["1"] }, description: include raw recent runs }
      responses:
        "200": { description: "{ today, unpriced, by_day[], by_listing[], recent? }" }
  /api/reconcile:
    servers: [ { url: http://localhost:3000 } ]
    post:
      tags: [management]
      summary: Pull Vilao billing and price any unpriced runs
      responses:
        "200": { content: { application/json: { example: { fetched: 34, matched: 1, stillUnpriced: 0 } } } }
  /api/keys:
    servers: [ { url: http://localhost:3000 } ]
    get:
      tags: [management]
      summary: List keys (prefix only; raw keys are never stored)
      responses:
        "200": { content: { application/json: { example: { data: [ { id: "…", name: cursor, key_prefix: "gw-d6d1…cbd3", role: client, active: 1, created_at: "2026-09-03T04:22:10.000Z" } ] } } } }
    post:
      tags: [management]
      summary: Issue a key. The raw key is returned ONCE.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string }, role: { type: string, enum: [client, admin], default: client } } },
                     example: { name: my-agent-app } } } }
      responses:
        "201": { content: { application/json: { example: { id: "…", key: "gw-0e4…", role: client } } } }
  /api/keys/{id}:
    servers: [ { url: http://localhost:3000 } ]
    parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
    delete:
      tags: [management]
      summary: Revoke a key (refuses to revoke the calling key)
      responses:
        "200": { content: { application/json: { example: { revoked: "8e206686-…" } } } }
        "400": { description: self_revoke }
        "404": { $ref: "#/components/responses/NotFound" }

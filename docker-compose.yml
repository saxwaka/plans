# Two containers: the gateway, reachable only on the compose network, and Caddy
# in front of it terminating TLS with a Let's Encrypt certificate. Nothing but
# Caddy is published to the host, so port 3000 is never on the internet.
services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - gateway-data:/app/data
    # No `ports:` on purpose — only Caddy talks to it.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/llms.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - GATEWAY_DOMAIN=${GATEWAY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway

volumes:
  gateway-data:
  caddy-data:
  caddy-config:
